name: Sudoku Beta 1.2 board and Coach visual audit (isolated)

# QA-only branch, no APK or game data changes; captures synthetic screens.
on:
  push:
    branches: [qa/beta12-board-coach-layout-review]

permissions:
  contents: read

jobs:
  screenshot-audit:
    name: Capture board and Coach emulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Core and Android unit regression
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run synthetic screenshot capture on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.BoardCoachVisualAuditTest
            mkdir -p visual-review
            adb pull /sdcard/Pictures/GridMates-Beta12-Visual/. visual-review/
            test "$(find visual-review -name '*.png' | wc -l)" -eq 4
            ls -lh visual-review
      - name: Upload screenshots for human inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta12-Board-Coach-Visual-${{ github.run_id }}
          path: |
            visual-review/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 3
