name: Sudoku Beta 1.2 completion and daily history QA (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/src/main/kotlin/com/playereden/sudokutogether/core/CompletionHighlights.kt'
      - 'core/src/main/kotlin/com/playereden/sudokutogether/core/DailyActivity.kt'
      - 'core/src/test/kotlin/com/playereden/sudokutogether/core/CompletionHighlightsTest.kt'
      - 'core/src/test/kotlin/com/playereden/sudokutogether/core/DailyActivityTest.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/HomeScreen.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/PlayScreen.kt'
      - 'app/src/androidTest/java/com/playereden/sudokutogether/FinishAndDailyPresentationUiTest.kt'
      - '.github/workflows/beta12-completion-daily-qa.yml'

permissions:
  contents: read

concurrency:
  group: sudoku-finish-daily-qa
  cancel-in-progress: true

jobs:
  results-and-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate core logic, app build and JVM tests
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test completion and Daily UI on Android 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.FinishAndDailyPresentationUiTest
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.DailyFinishUiTest
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Finish-Daily-UI-Reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/reports/tests/**
            core/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 3
