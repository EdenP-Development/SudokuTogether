name: Sudoku Beta 1.2 LAN round input-mode QA (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/playereden/sudokutogether/GameViewModel.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/PlayScreen.kt'
      - 'app/src/androidTest/java/com/playereden/sudokutogether/MultiplayerRoundInputModeTest.kt'
      - 'app/src/androidTest/java/com/playereden/sudokutogether/MultiplayerPolishUiTest.kt'
      - '.github/workflows/beta12-lan-round-qa.yml'

permissions:
  contents: read

jobs:
  lan-input-mode:
    name: Core units, Android Co-op round and Versus regressions
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify Kotlin and core/Android unit suites
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 36 hosted round, guest identity, Versus and Co-op rendering
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            # Check dense candidate fit first; a failure should not spend
            # the remaining emulator budget on unrelated already-green tests.
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.MultiplayerPolishUiTest
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.MultiplayerRoundInputModeTest
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.VersusPresenceUiTest
      - name: Keep regression evidence on failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-LAN-Round-Regression-Failures
          path: |
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 2
