name: GridMates Beta 2 public-facing screens QA (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/playereden/sudokutogether/AboutGame.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/ProgressBackup.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/ProgressBackupSettings.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/MainActivity.kt'
      - 'app/src/androidTest/java/com/playereden/sudokutogether/PublicReleaseCopyUiTest.kt'
      - '.github/workflows/beta2-player-facing-qa.yml'

permissions:
  contents: read

concurrency:
  group: gridmates-beta2-player-facing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  player-facing:
    name: About and progress restore Android UI QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile all Android tests and unit checks
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --no-daemon --max-workers=2 --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify public release copy and backup UI at API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.PublicReleaseCopyUiTest
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.ProgressBackupSettingsUiTest
      - name: Preserve reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-Player-Facing-Failures
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 3
