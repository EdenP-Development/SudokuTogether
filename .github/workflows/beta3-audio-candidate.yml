name: Beta 3 unsigned audio candidate
on:
  push:
    branches: [feat/beta3-foundation]
    paths:
      - '.github/workflows/beta3-audio-candidate.yml'
      - 'app/build.gradle.kts'
      - 'app/src/**'
      - 'core/src/**'
      - 'scripts/prepare_beta3_soundtrack.py'
      - 'scripts/rehearse_beta3_public_ui.py'
      - 'scripts/sign_beta3_rehearsal.sh'
      - 'scripts/verify_beta3_public_upgrade_pair.sh'
      - 'scripts/run_beta3_public_upgrade_phase.sh'
      - 'design/audio/transfer/**'
  workflow_dispatch:
    inputs:
      signed_rehearsal:
        description: 'Run private signing and historical APK identity rehearsal (no APK upload)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/feat/beta3-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Check rehearsal script syntax
        run: |
          for script in scripts/sign_beta3_rehearsal.sh scripts/verify_beta3_public_upgrade_pair.sh scripts/run_beta3_public_upgrade_phase.sh; do bash -n "$script"; done
          python -m py_compile scripts/rehearse_beta3_public_ui.py
      - name: Verify bundled Spudacus artwork
        run: echo '74773dbda822161f73a639f959e8bce5c6e0b333a94ebeb8ee27f620d4995d25  app/src/main/res/drawable-nodpi/spudacus_v1_full_transparent.png' | sha256sum -c -
      - name: Verify bundled GridMates artwork
        run: echo 'eef6d631cac0b9523f7e0dbebac229f9a2458d36fe2e73e111d251704d9ff292  app/src/main/res/drawable-nodpi/gridmates_v1_runtime_transparent.png' | sha256sum -c -
      - name: Generate adaptive icon from verified master
        run: |
          python - <<'PY'
          import pathlib, hashlib, zipfile, io
          from PIL import Image, ImageDraw
          root = pathlib.Path('design/branding/transfer')
          parts = sorted(root.glob('part-*.bin'))
          assert [p.name for p in parts] == [f'part-{i:02}.bin' for i in range(1,15)]
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '487ee37d5087822e9b085b1dddf2e04b01b13a2d70d8e24dd90e60b233bf0dc8'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              master = z.read('launcher-master.png')
          assert hashlib.sha256(master).hexdigest() == 'ea3812eb46f6d3601fd5edf1d1f1f2d1c9c445a4140c7e1d2a86c08563d3367f'
          with Image.open(io.BytesIO(master)) as im:
              assert im.format == 'PNG' and im.size == (1254,1254)
              icon = im.convert('RGBA')
          res = pathlib.Path('build/beta3-visual-res')
          drawable = res / 'drawable-nodpi'
          drawable.mkdir(parents=True,exist_ok=True)
          # 108dp adaptive canvas; 58dp art centered within the 66dp visible region.
          canvas = Image.new('RGBA',(432,432))
          canvas.alpha_composite(icon.resize((232,232),Image.Resampling.LANCZOS),(100,100))
          canvas.save(drawable/'beta3_fox_foreground.png')
          mip = res/'mipmap-anydpi-v26'
          mip.mkdir(parents=True,exist_ok=True)
          (mip/'ic_launcher.xml').write_text('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/icon_background"/><foreground android:drawable="@drawable/beta3_fox_foreground"/><monochrome android:drawable="@drawable/ic_launcher_monochrome"/></adaptive-icon>')
          out = pathlib.Path('beta3-review')
          out.mkdir()
          # Simulated centered 66dp mask, not physical launcher evidence.
          composite = Image.new('RGBA',(432,432),'#123e28')
          composite.alpha_composite(canvas)
          visible = composite.crop((84,84,348,348))
          for name,radius in [('circle',132),('rounded',50),('square',12)]:
              mask = Image.new('L',(264,264))
              ImageDraw.Draw(mask).rounded_rectangle((0,0,263,263),radius=radius,fill=255)
              sample = visible.copy()
              sample.putalpha(mask)
              sample.save(out/f'icon-{name}.png')
          PY
      - name: Verify and extract soundtrack
        run: python scripts/prepare_beta3_soundtrack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and test unsigned candidate
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease -PgridmatesPermanentIdentityStaging=true -PgridmatesBeta3AudioCandidate=true -PgridmatesBeta3ProductionParity=true -PgridmatesBeta3UpgradeCandidate=true --no-daemon --max-workers=2 --console=plain
      - name: Verify unsigned candidate identity and audio contents
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$APK"
          "$TOOLS/aapt" dump badging "$APK" > candidate-badging.txt
          grep -F "package: name='com.playereden.gridmates.sudoku.beta' versionCode='32' versionName='1.0.0-beta.3'" candidate-badging.txt
          if "$TOOLS/apksigner" verify "$APK"; then
            echo "Unexpected signed candidate"
            exit 1
          fi
          "$TOOLS/aapt2" dump resources "$APK" > candidate-resources.txt
          python - <<'PY'
          import hashlib, pathlib, zipfile, re, json
          paths = sorted(pathlib.Path('build/beta3-audio-assets/soundtrack').glob('track_*.m4a'))
          assert [p.name for p in paths] == [f'track_{i:02}.m4a' for i in range(1,7)]
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release-unsigned.apk') as z:
              assert sorted(n for n in z.namelist() if n.startswith('assets/soundtrack/') and not n.endswith('/')) == ['assets/soundtrack/' + p.name for p in paths]
              for p in paths:
                  entry = z.getinfo('assets/soundtrack/' + p.name)
                  assert entry.compress_type == zipfile.ZIP_STORED
                  assert hashlib.sha256(z.read(entry)).digest() == hashlib.sha256(p.read_bytes()).digest()
              ids = 'happy approve disapprove appreciation thinking celebration oops greeting confused applause break ready'.split()
              resources = {}
              current = None
              for line in pathlib.Path('candidate-resources.txt').read_text().splitlines():
                  header = re.search(r'^\s*resource\s+0x[0-9a-fA-F]+\s+(\S+)', line)
                  if header:
                      current = header.group(1).split(':')[-1]
                      continue
                  if current and '(file)' in line:
                      match = re.search(r'\(file\)\s+(\S+)', line)
                      if match:
                          resources.setdefault(current, []).append(match.group(1))
              for ident in ids:
                  name = 'gm_emote_fox_' + ident
                  matches = resources.get('drawable/' + name, [])
                  assert len(matches) == 1, (name, matches)
                  source = pathlib.Path('app/build/generated/foxEmotes/res/drawable-nodpi') / (name + '.webp')
                  assert hashlib.sha256(z.read(matches[0])).digest() == hashlib.sha256(source.read_bytes()).digest(), name
              for name in ['gridmates_header_approved','beta3_fox_foreground','spudacus_v1_full_transparent','gridmates_v1_runtime_transparent']:
                  matches = resources.get('drawable/' + name, [])
                  assert len(matches) == 1 and matches[0] in z.namelist(), name
              versus = json.loads(pathlib.Path('design/versus-v9/manifest.json').read_text())
              portraits = json.loads(pathlib.Path('design/collection-art/illustrated-five-manifest.json').read_text())
              for item in [versus] + portraits['records']:
                  name = 'drawable/' + pathlib.Path(item['path']).stem
                  matches = resources.get(name, [])
                  assert len(matches) == 1, (name, matches)
                  data = z.read(matches[0])
                  assert len(data) == item['size_bytes'], name
                  assert hashlib.sha256(data).hexdigest() == item['sha256'], name
          print('Six tracks, twelve Fox emote hashes, four branding resources and six original artwork fingerprints verified.')
          PY
      - name: Verify compiled production visual flags and launcher
        run: |
          set -euo pipefail
          mkdir -p release-audit
          python - <<'PY'
          import pathlib, re, subprocess, os
          apk = 'app/build/outputs/apk/release/app-release-unsigned.apk'
          tool = os.environ['ANDROID_HOME'] + '/build-tools/35.0.0/aapt2'
          resources = {}
          current = None
          for line in pathlib.Path('candidate-resources.txt').read_text().splitlines():
              header = re.search(r'^\s*resource\s+(0x[0-9a-fA-F]+)\s+(\S+)', line)
              if header:
                  current = header.group(2).split(':')[-1]
                  resources[current] = (header.group(1).lower(), [])
              elif current:
                  resources[current][1].append(line)
          expected = {
              'gridmates_insignia_art_enabled': True,
              'gridmates_portrait_refinement_enabled': True,
              'gridmates_versus_v9_enabled': True,
              'gridmates_insignia_preview_enabled': False,
              'gridmates_versus_v8b_enabled': False,
          }
          pathlib.Path('release-audit/resources.txt').write_text(pathlib.Path('candidate-resources.txt').read_text())
          evidence = []
          for name, enabled in expected.items():
              _, lines = resources['bool/' + name]
              values = []
              for line in lines:
                  match = re.search(r'\b(true|false)\s*$', line, re.I)
                  if match:
                      values.append(match.group(1).lower() == 'true')
              assert values and all(v == enabled for v in values), (name, lines)
              evidence.append(f'{name}: {enabled}')
          pathlib.Path('release-audit/visual-flags.txt').write_text('\n'.join(evidence) + '\n')
          launcher_id, lines = resources['mipmap/ic_launcher']
          adaptive = []
          for line in lines:
              match = re.search(r'\(file\)\s+(\S+)', line)
              if match and match.group(1).endswith('.xml'):
                  adaptive.append(match.group(1))
          # AAPT2 may strip v26 when minSdk already guarantees adaptive icons.
          assert len(adaptive) == 1, lines
          def xml(path):
              return subprocess.check_output([tool, 'dump', 'xmltree', '--file', path, apk], text=True)
          icon = xml(adaptive[0])
          pathlib.Path('release-audit/adaptive-launcher.txt').write_text(icon)
          manifest = xml('AndroidManifest.xml')
          # AAPT2 renders namespace URIs instead of the source prefix.
          icon = icon.replace('http://schemas.android.com/apk/res/android:', 'android:')
          manifest = manifest.replace('http://schemas.android.com/apk/res/android:', 'android:')
          fox_id = resources['drawable/beta3_fox_foreground'][0]
          assert 'adaptive-icon' in icon
          foreground = re.search(r'E: foreground[^\n]*\n\s*A: android:drawable[^\n]*', icon)
          assert foreground and fox_id in foreground.group(0).lower(), icon
          for attr in ('icon', 'roundIcon'):
              matches = re.findall(r'^\s*A: android:' + attr + r'\([^)]*\)[^\n]*$', manifest, re.M)
              assert any(launcher_id in line.lower() for line in matches), (attr, matches)
          evidence.append(f'Launcher {launcher_id} -> {adaptive[0]} -> Fox foreground {fox_id}')
          root = pathlib.Path('release-audit')
          (root / 'visual-config.txt').write_text('\n'.join(evidence) + '\n')
          (root / 'adaptive-launcher.txt').write_text(icon)
          print('\n'.join(evidence))
          PY
      - name: Capture and audit release dependencies and packaged manifest
        run: |
          set -euo pipefail
          mkdir -p release-audit
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath -PgridmatesPermanentIdentityStaging=true -PgridmatesBeta3AudioCandidate=true -PgridmatesBeta3ProductionParity=true -PgridmatesBeta3UpgradeCandidate=true --no-daemon --max-workers=2 --console=plain > release-audit/dependencies.txt
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/aapt" dump permissions "$APK" > release-audit/permissions.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > release-audit/manifest.txt
          cp candidate-badging.txt release-audit/badging.txt
          cp candidate-resources.txt release-audit/resources.txt
          sha256sum "$APK" > release-audit/unsigned-apk.sha256
          git rev-parse HEAD > release-audit/source-commit.txt
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path('release-audit')
          deps = (root / 'dependencies.txt').read_text()
          assert 'releaseRuntimeClasspath' in deps
          assert not re.search(r'\bFAILED\b', deps), 'Unresolved dependency'
          blocked = re.findall(r'(?:com\.google\.android\.gms|com\.google\.firebase|com\.android\.billingclient|com\.amazon\.device|com\.facebook\.android|com\.applovin|com\.adjust\.sdk|com\.appsflyer):[^\s]+', deps)
          assert not blocked, f'Review unexpected SDK dependencies: {blocked}'
          permissions = set(re.findall(r"uses-permission(?:-sdk-23)?: name='([^']+)'", (root / 'permissions.txt').read_text()))
          expected = {'android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE', 'android.permission.ACCESS_WIFI_STATE', 'android.permission.CHANGE_WIFI_MULTICAST_STATE'}
          allowed = expected | {'com.playereden.gridmates.sudoku.beta.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'}
          assert expected <= permissions, f'Missing expected permissions: {expected - permissions}'
          assert permissions <= allowed, f'Review unexpected permissions: {permissions - allowed}'
          print('Release dependency and permission screening passed; manual manifest and traffic review still required.')
          PY
      - name: Recover exact historical Beta 2 archive
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.signed_rehearsal) ||
          (github.event_name == 'push' && github.event.head_commit.message == 'ci: build STAB-10.24 downloadable owner playtest')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/gridmates-public-rehearsal"
          gh api repos/EdenP-Development/SudokuTogether/actions/artifacts/14962779795/zip > "$RUNNER_TEMP/gridmates-public-rehearsal/beta2.zip"
          echo "0dc6b20ac75db841f5b2fd407e4991111764301d6f9f28faead74c01afd9b432  $RUNNER_TEMP/gridmates-public-rehearsal/beta2.zip" | sha256sum -c -
          python - <<'PY'
          import os, pathlib, zipfile, hashlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gridmates-public-rehearsal'
          with zipfile.ZipFile(root / 'beta2.zip') as z:
              assert z.testzip() is None
              names = [n for n in z.namelist() if n.endswith('.apk')]
              assert len(names) == 1, names
              data = z.read(names[0])
          assert hashlib.sha256(data).hexdigest() == '28f9fb4888f6ee32e960d22152b84aeed4daef55e9ec0230cb53725daa50b89c'
          (root / 'beta2.apk').write_bytes(data)
          PY
      - name: Privately sign audited candidate and verify pair
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.signed_rehearsal) ||
          (github.event_name == 'push' && github.event.head_commit.message == 'ci: build STAB-10.24 downloadable owner playtest')
        env:
          KEYSTORE_BASE64: ${{ secrets.GRIDMATES_SUDOKU_BETA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRIDMATES_SUDOKU_BETA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gridmates-public-rehearsal"
          bash scripts/sign_beta3_rehearsal.sh app/build/outputs/apk/release/app-release-unsigned.apk release-audit/unsigned-apk.sha256 "$root/beta3.apk" | tee release-audit/signing-rehearsal.txt
          bash scripts/verify_beta3_public_upgrade_pair.sh "$root/beta2.apk" "$root/beta3.apk" | tee release-audit/public-pair.txt
      - name: Enable KVM for signed rehearsal
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.signed_rehearsal) ||
          (github.event_name == 'push' && github.event.head_commit.message == 'ci: build STAB-10.24 downloadable owner playtest')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Public signed install-over and Solo UI continuity
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.signed_rehearsal) ||
          (github.event_name == 'push' && github.event.head_commit.message == 'ci: build STAB-10.24 downloadable owner playtest')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: python3 scripts/rehearse_beta3_public_ui.py release-audit/public-ui "$RUNNER_TEMP/gridmates-public-rehearsal/beta2.apk" "$RUNNER_TEMP/gridmates-public-rehearsal/beta3.apk"
      - name: Prepare verified owner playtest download
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ci: build STAB-10.24 downloadable owner playtest'
        run: |
          set -euo pipefail
          test -s release-audit/public-ui/public-ui-result.txt
          grep -Fq 'PASS: all 81 accessible cell descriptions preserved' release-audit/public-ui/public-ui-result.txt
          mkdir -p owner-playtest
          cp "$RUNNER_TEMP/gridmates-public-rehearsal/beta3.apk" owner-playtest/GridMates-Sudoku-1.0.0-beta.3-OWNER-PLAYTEST.apk
          (cd owner-playtest && sha256sum *.apk > SHA256SUMS.txt)
          cp release-audit/source-commit.txt release-audit/public-pair.txt release-audit/public-ui/public-ui-result.txt owner-playtest/
          printf '%s\n' 'Beta 3 owner playtest; publicly accessible Actions artifact, not an official itch.io or Google Play release.' 'Install over Beta 2; back up important progress first. Do not uninstall or clear data if upgrade fails.' > owner-playtest/README.txt
      - name: Upload owner playtest APK (public repository artifact)
        if: >-
          github.event_name == 'push' && github.event.head_commit.message == 'ci: build STAB-10.24 downloadable owner playtest'
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Sudoku-Beta3-OWNER-PLAYTEST
          path: owner-playtest/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary rehearsal APKs
        if: always()
        run: rm -rf "$RUNNER_TEMP/gridmates-public-rehearsal" owner-playtest
      - name: Retain text-only release audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beta3-release-audit-text
          path: release-audit/
          if-no-files-found: warn
          retention-days: 14
      # APK upload is limited to the explicitly approved owner-playtest trigger.
