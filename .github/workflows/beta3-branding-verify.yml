name: Beta 3 branding verification
on:
  push:
    branches: [feat/beta3-foundation]
    paths:
      - 'design/branding/transfer/**'
      - '.github/workflows/beta3-branding-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original archive and inspect PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, zipfile, io, struct
          root = pathlib.Path('design/branding/transfer')
          parts = sorted(root.glob('part-*.bin'))
          assert [p.name for p in parts] == [f'part-{i:02}.bin' for i in range(1,15)]
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '487ee37d5087822e9b085b1dddf2e04b01b13a2d70d8e24dd90e60b233bf0dc8'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              entries = z.infolist()
              assert len(entries) <= 30
              assert sum(e.file_size for e in entries) <= 64*1024*1024
              names = [e.filename for e in entries]
              assert len(names) == len(set(names))
              for e in entries:
                  p = pathlib.PurePosixPath(e.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in e.filename
                  assert (e.external_attr >> 16) & 0o170000 != 0o120000
              assert z.testzip() is None
              pngs = [e for e in entries if e.filename.lower().endswith('.png')]
              assert len(pngs) == 6
              dimensions = []
              for e in pngs:
                  b = z.read(e)
                  assert b[:8] == b'\x89PNG\r\n\x1a\n' and b[12:16] == b'IHDR'
                  w,h = struct.unpack('>II',b[16:24])
                  dimensions.append((w,h))
                  print(e.filename, w,h,hashlib.sha256(b).hexdigest())
              assert sorted(dimensions) == sorted([(1254,1254)]*3+[(1536,658),(1536,807),(2172,724)])
              for e in entries:
                  if not e.is_dir() and 'manifest' in e.filename.lower():
                      print('Manifest:',e.filename)
                      print(z.read(e).decode('utf-8')[:20000])
          print('Archive SHA-256, CRC, paths, six PNG headers and dimensions verified.')
          PY
