name: Beta 3 branding verification
on:
  push:
    branches: [feat/beta3-foundation]
    paths:
      - 'design/branding/transfer/**'
      - '.github/workflows/beta3-branding-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify and export original artwork
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile, io, json
          from PIL import Image
          root = pathlib.Path('design/branding/transfer')
          parts = sorted(root.glob('part-*.bin'))
          assert [p.name for p in parts] == [f'part-{i:02}.bin' for i in range(1,15)]
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '487ee37d5087822e9b085b1dddf2e04b01b13a2d70d8e24dd90e60b233bf0dc8'
          expected = {'full-emblem.png':('PNG',1254,1254), 'favicon.png':('PNG',1254,1254), 'launcher-master.png':('PNG',1254,1254), 'wide-cover.png':('WEBP',1536,658), 'social-share.png':('WEBP',1536,807), 'transparent-logo.png':('PNG',2172,724)}
          out = pathlib.Path('verified-branding')
          out.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              entries = z.infolist()
              assert len(entries) <= 30 and sum(e.file_size for e in entries) <= 64*1024*1024
              names = [e.filename for e in entries]
              assert len(names) == len(set(names))
              for e in entries:
                  p = pathlib.PurePosixPath(e.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in e.filename
                  assert (e.external_attr >> 16) & 0o170000 != 0o120000
              assert z.testzip() is None
              manifest = json.loads(z.read('manifest.json'))
              assert len(manifest['assets']) == 6
              assert {a['file'] for a in manifest['assets']} == set(expected)
              assert {e.filename for e in entries if not e.is_dir()} == set(expected) | {'manifest.json'}
              receipt = []
              for a in manifest['assets']:
                  name = a['file']
                  b = z.read(name)
                  digest = hashlib.sha256(b).hexdigest()
                  assert digest == a['sha256']
                  fmt,w,h = expected[name]
                  with Image.open(io.BytesIO(b)) as im:
                      assert im.format == fmt and im.size == (w,h) and list(im.size) == a['dimensions']
                      assert im.mode == a['mode']
                      im.verify()
                  with Image.open(io.BytesIO(b)) as im:
                      im.load()
                  dest = pathlib.Path(name).with_suffix('.webp' if fmt == 'WEBP' else '.png').name
                  (out / dest).write_bytes(b)
                  receipt.append({'source':name,'file':dest,'format':fmt,'sha256':digest,'dimensions':[w,h]})
                  print(dest, fmt, w,h,digest)
              (out / 'original-manifest.json').write_bytes(z.read('manifest.json'))
              (out / 'verification.json').write_text(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Beta3-verified-original-branding
          path: verified-branding/
          if-no-files-found: error
          retention-days: 14
