name: Beta 3 save integrity runtime
on:
  push:
    branches: [feat/beta3-foundation]
    paths:
      - '.github/workflows/beta3-save-integrity-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta3-save-integrity-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  save-runtime:
    if: github.ref == 'refs/heads/feat/beta3-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute isolated storage and navigation instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.LocalPlayerStoreTest,com.playereden.sudokutogether.ProgressBackupTest,com.playereden.sudokutogether.LocalNavigationTest --no-daemon --max-workers=2 --console=plain
      - name: Retain test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beta3-save-runtime-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
