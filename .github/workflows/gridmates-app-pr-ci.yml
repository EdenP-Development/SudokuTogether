name: GridMates Android PR quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/gridmates-app-pr-ci.yml'
  push:
    branches: [main, feat/beta3-foundation]
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/gridmates-app-pr-ci.yml'

permissions:
  contents: read

concurrency:
  group: gridmates-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-compile-unit-lint:
    name: Android compile, JVM regressions and lint (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install declared Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run source and UI-test compilation quality gate
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleDebug --no-daemon --max-workers=2 --console=plain
      - name: Save test and lint diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Android-PR-Failures
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 3
