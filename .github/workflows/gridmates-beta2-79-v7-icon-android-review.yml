name: GridMates Beta 2 unified 79 Versus V7 and launcher review
on:
  push:
    branches: [feat/beta2-79-versusv7-integrated-review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridmates-beta2-v7-integrated-review
  cancel-in-progress: true
jobs:
  real-android-review:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install PNG and license validation libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 fonttools==4.60.1
      - name: Verify V7 original art, launcher icon resources and unchanged Co-op V5
        run: python scripts/verify_beta2_v7_source.py
      - name: Verify all 8 original Ocean Woodland PNGs
        run: python scripts/audit_beta2_original_art.py --require-original-art
      - name: Verify original four number fonts and OFL licenses
        run: python scripts/verify_beta2_font_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build full 79-cosmetic app, JVM matrix, lint and Android tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleDebug -PgridmatesBeta2V7Preview=true --no-daemon --max-workers=2 --console=plain
      - name: Check separate APK package, signer, embedded art and new icon
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk GridMates-Beta2-79-V7-IconB-OwnerPreview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs GridMates-Beta2-79-V7-IconB-OwnerPreview.apk > integrated-signer.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GridMates-Beta2-79-V7-IconB-OwnerPreview.apk > integrated-badging.txt
          grep -F "package: name='com.playereden.sudokutogether.qa.beta2v7'" integrated-badging.txt
          sha256sum GridMates-Beta2-79-V7-IconB-OwnerPreview.apk > GridMates-Beta2-79-V7-IconB-OwnerPreview.apk.sha256
          python scripts/verify_beta2_font_sources.py GridMates-Beta2-79-V7-IconB-OwnerPreview.apk
          python - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path("GridMates-Beta2-79-V7-IconB-OwnerPreview.apk")
          with zipfile.ZipFile(apk) as z:
              assert "res/drawable-nodpi/gm_mode_versus_woodland_v7_hd.png" in z.namelist()
              print("PASS: original V7 PNG embedded in complete 79-item reviewer")
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 V7, Co-op V5, Home and matrix UI regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.playereden.sudokutogether.qa.beta2v7/com.playereden.sudokutogether.MainActivity
            adb shell pidof com.playereden.sudokutogether.qa.beta2v7
            ./gradlew :app:connectedDebugAndroidTest -PgridmatesBeta2V7Preview=true --no-daemon --max-workers=2 --console=plain "-Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.VersusV7ArtUiTest,com.playereden.sudokutogether.HomeLivingBookUiTest,com.playereden.sudokutogether.Beta2StyleCompatibilityUiTest"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/beta2_v7_capture.py
      - name: Validate actual screenshots and distinct Co-op/Versus views
        run: python scripts/verify_beta2_v7_screens.py
      - name: Publish complete reviewer APK and Android screenshot evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-79-V7-IconB-OwnerPreview
          path: |
            GridMates-Beta2-79-V7-IconB-OwnerPreview.apk
            GridMates-Beta2-79-V7-IconB-OwnerPreview.apk.sha256
            integrated-badging.txt
            integrated-signer.txt
            beta2-v7-versus-android.png
            beta2-v7-coop-android.png
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics if regression fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-79-V7-IconB-Failure-Diagnostics
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 5
