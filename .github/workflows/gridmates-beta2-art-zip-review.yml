name: GridMates Beta 2 seven-sprite offline art reviewer

on:
  push:
    branches:
      - feat/beta2-art-zip-reviewer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-art-review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image auditing dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 fonttools==4.60.1
      - name: Pin original GridMates portraits and licensed number fonts
        run: |
          python scripts/audit_beta2_original_art.py --require-original-art
          python scripts/verify_beta2_font_sources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile app, UI tests, JVM tests, lint, and separate APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleDebug -PgridmatesBeta2ArtZipPreview=true --no-daemon --max-workers=2 --console=plain
      - name: Validate distinct package, candidate exclusion, and signer
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk GridMates-Beta2-Art-Zip-Review.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GridMates-Beta2-Art-Zip-Review.apk > art-review-badging.txt
          grep -F "package: name='com.playereden.sudokutogether.qa.beta2artzip'" art-review-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs GridMates-Beta2-Art-Zip-Review.apk > art-review-signing.txt
          sha256sum GridMates-Beta2-Art-Zip-Review.apk > GridMates-Beta2-Art-Zip-Review.apk.sha256
          python - <<'PY'
          import zipfile
          from pathlib import Path
          names=zipfile.ZipFile("GridMates-Beta2-Art-Zip-Review.apk").namelist()
          assert any(name.endswith("/farm_cow.png") for name in names), "Missing canonical Cow PNG"
          assert any(name.endswith("/garden_sunflower.png") for name in names), "Missing canonical Sunflower PNG"
          assert any(name.endswith("/ocean_octopus.png") for name in names), "Missing canonical Octopus PNG"
          assert not any(name.endswith("/farm_goat_candidate.png") for name in names), "Candidates must remain ZIP-import only"
          print("PASS: canonical artworks bundled, candidate art not bundled")
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 real launcher and safe ZIP import tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.playereden.sudokutogether.qa.beta2artzip/com.playereden.sudokutogether.ArtReviewActivity
            adb shell pidof com.playereden.sudokutogether.qa.beta2artzip
            ./gradlew :app:connectedDebugAndroidTest -PgridmatesBeta2ArtZipPreview=true --no-daemon --max-workers=2 --console=plain "-Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.ArtReviewZipUiTest"
            adb shell am start -W -n com.playereden.sudokutogether.qa.beta2artzip/com.playereden.sudokutogether.ArtReviewActivity
            adb shell screencap -p /sdcard/gridmates-art-review.png
            adb pull /sdcard/gridmates-art-review.png gridmates-art-review-android.png
      - name: Publish separately installable APK and screen capture
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-Art-Zip-Review
          path: |
            GridMates-Beta2-Art-Zip-Review.apk
            GridMates-Beta2-Art-Zip-Review.apk.sha256
            art-review-badging.txt
            art-review-signing.txt
            gridmates-art-review-android.png
          if-no-files-found: error
          retention-days: 14
      - name: Diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-Art-Zip-Review-Diagnostics
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 5
