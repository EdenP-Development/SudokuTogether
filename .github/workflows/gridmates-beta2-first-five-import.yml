name: Import GridMates first five Android portrait candidates
on:
  push:
    branches: [feat/beta2-first-five-portraits-review]
    paths: ['.github/workflows/gridmates-beta2-first-five-import.yml']
permissions:
  contents: write
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Get verified original 512px transparent portrait art
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/63102949bf6d46be1899b9fbd4745c38e5c800dcfc73432aab9e37c9763e7870.png" -o "app/src/main/res/drawable-nodpi/farm_cow.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/03039d4f3ba402d67410790cfcd975f2735f01b08915df30e1064e639abaf7e6.png" -o "app/src/main/res/drawable-nodpi/farm_chicken.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/c71a38b4f464d801ae6caac962279bffc0b804c4916313f992d920e40fe0e49e.png" -o "app/src/main/res/drawable-nodpi/woodland_raccoon.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/2214f7b6a8cf4bed950bf80c8e5a1509b955a9959a192d164873d961fd0362b7.png" -o "app/src/main/res/drawable-nodpi/ocean_sea_turtle.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/4a6b697affea4871b7015389adea24228be0a8bf0a70aa86f3695c32a90f31d8.png" -o "app/src/main/res/drawable-nodpi/garden_firefly.png"
          python3 - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          manifest=json.loads(Path("design/beta2-content-pack/first-five-android-art.json").read_text())
          assert manifest["status"]=="ISOLATED_ANDROID_REVIEW_CANDIDATE_NOT_APPROVED"
          assert len(manifest["images"])==5
          for item in manifest["images"]:
              p=Path(item["path"])
              b=p.read_bytes()
              assert hashlib.sha256(b).hexdigest()==item["sha256"],f"Hash mismatch: {p}"
              assert len(b)==item["bytes"],f"Length mismatch: {p}"
              assert b[:8]==bytes((137,80,78,71,13,10,26,10))
              assert b[12:16]==b"IHDR"
              assert struct.unpack(">II",b[16:24])==(512,512)
              assert b[25]==6,f"Require 32-bit RGBA/alpha: {p}"
              print("Verified",p,item["sha256"])
          PY
      - name: Commit original image resources to isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/farm_cow.png app/src/main/res/drawable-nodpi/farm_chicken.png app/src/main/res/drawable-nodpi/woodland_raccoon.png app/src/main/res/drawable-nodpi/ocean_sea_turtle.png app/src/main/res/drawable-nodpi/garden_firefly.png
          git diff --cached --quiet && exit 0
          git commit -m "art: stage five verified transparent animal portraits for isolated Android review"
          git push origin HEAD:feat/beta2-first-five-portraits-review
