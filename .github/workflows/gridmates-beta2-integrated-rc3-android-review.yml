name: GridMates Beta 2 integrated RC3 owner review
on:
  push:
    branches: [feat/beta2-integrated-rc3-review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridmates-beta2-integrated-rc3
  cancel-in-progress: true
jobs:
  real-android-review:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install PNG and license validation libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 fonttools==4.60.1 cairosvg==2.7.1
      - name: Verify dedicated V9 source if imported
        run: python scripts/verify_versus_v9_source.py
      - name: Audit every original Collection portrait and candidate source
        run: python scripts/audit_collection_art_complete.py
      - name: Publish source audit independently of Android result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-Collection-Art-Audit
          path: art-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify V7 original art, launcher icon resources and unchanged Co-op V5
        run: python scripts/verify_beta2_v7_source.py
      - name: Verify all 8 original Ocean Woodland PNGs
        run: python scripts/audit_beta2_original_art.py --require-original-art
      - name: Verify original four number fonts and OFL licenses
        run: python scripts/verify_beta2_font_sources.py
      - name: Verify six new artist-authored vector resources
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          n="{http://schemas.android.com/apk/res/android}"
          palette={"#214F3F","#9A7641","#F4E7C4","#00000000"}
          for name in ("constellation","sunrise","focus","compass","moonlight","grid_master"):
              p=Path(f"app/src/main/res/drawable/gm_insignia_candidate_{name}.xml")
              root=ET.parse(p).getroot()
              assert root.tag=="vector" and root.attrib[n+"viewportWidth"]=="96"
              paths=list(root)
              assert len(paths)>=2, (name, len(paths))
              # The image must be the glyph, NEVER a pre-baked avatar/profile
              # ring. Borders may become their own independently equipped
              # cosmetic in a later release.
              forbidden="M48,10 C69,10 86,27 86,48"
              assert not any(forbidden in part.attrib[n+"pathData"] for part in paths),name
              for part in paths:
                  assert part.tag=="path"
                  assert part.attrib[n+"fillColor"] in palette
                  assert part.attrib[n+"strokeColor"] in palette
                  assert part.attrib[n+"pathData"], name
              print("PASS: border-free",name)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build 85-cosmetic integrated RC3 with six refined insignias + natural Versus V8-B
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleDebug -PgridmatesBeta2IntegratedRc3Preview=true --no-daemon --max-workers=2 --console=plain
      - name: Check separate APK package, signer, embedded art and new icon
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk GridMates-Beta2-Integrated-RC3-OwnerPreview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs GridMates-Beta2-Integrated-RC3-OwnerPreview.apk > integrated-signer.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging GridMates-Beta2-Integrated-RC3-OwnerPreview.apk > integrated-badging.txt
          grep -F "package: name='com.playereden.sudokutogether.qa.beta2integratedrc3'" integrated-badging.txt
          sha256sum GridMates-Beta2-Integrated-RC3-OwnerPreview.apk > GridMates-Beta2-Integrated-RC3-OwnerPreview.apk.sha256
          python scripts/verify_beta2_font_sources.py GridMates-Beta2-Integrated-RC3-OwnerPreview.apk
          python - <<'PY'
          import zipfile, hashlib, json
          from pathlib import Path
          apk=Path("GridMates-Beta2-Integrated-RC3-OwnerPreview.apk")
          original=json.loads(Path("design/versus-v7/manifest.json").read_text())["output"]
          with zipfile.ZipFile(apk) as z:
              # Android aapt2 compiles nodpi to drawable-nodpi-v4; avoid assuming
              # that package resource paths are identical to source folders.
              images=[p for p in z.namelist() if p.endswith("/gm_mode_versus_woodland_v7_hd.png")]
              assert len(images)==1, f"Expected exactly one original V7 PNG: {images}"
              image=z.read(images[0])
              assert hashlib.sha256(image).hexdigest()==original["sha256"], "V7 pixels changed in APK"
              assert len(image)==original["bytes"], "V7 image byte count changed"
              for name in ("ic_launcher_foreground.xml","ic_launcher_monochrome.xml"):
                  assert any(p.endswith("/"+name) for p in z.namelist()), f"Missing compiled launcher asset {name}"
              v9=json.loads(Path("design/versus-v9/manifest.json").read_text())
              if Path(v9["path"]).exists():
                  matches=[p for p in z.namelist() if p.endswith("/gm_mode_versus_woodland_v9_hd.png")]
                  assert len(matches)==1,matches
                  assert hashlib.sha256(z.read(matches[0])).hexdigest()==v9["sha256"]
              print("PASS: original byte-exact V7 PNG and launcher vectors packaged at",images[0])
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 integrated RC3 Versus V8-B, Basic insignias, album and Co-op regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.playereden.sudokutogether.qa.beta2integratedrc3/com.playereden.sudokutogether.MainActivity
            adb shell pidof com.playereden.sudokutogether.qa.beta2integratedrc3
            ./gradlew :app:connectedDebugAndroidTest -PgridmatesBeta2IntegratedRc3Preview=true --no-daemon --max-workers=2 --console=plain "-Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.VersusV8BNaturalUiTest,com.playereden.sudokutogether.HomeLivingBookUiTest,com.playereden.sudokutogether.Beta2StyleCompatibilityUiTest,com.playereden.sudokutogether.CollectionPolishUiTest,com.playereden.sudokutogether.Beta2Unified75UiTest,com.playereden.sudokutogether.VeteranRewardsUiTest,com.playereden.sudokutogether.Beta2VisualPolishUiTest,com.playereden.sudokutogether.AchievementAlbumUiTest,com.playereden.sudokutogether.InsigniaConceptUiTest,com.playereden.sudokutogether.PortraitRefinementUiTest"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            GRIDMATES_REVIEW_PACKAGE=com.playereden.sudokutogether.qa.beta2integratedrc3 python3 scripts/beta2_v7_capture.py
            GRIDMATES_REVIEW_PACKAGE=com.playereden.sudokutogether.qa.beta2integratedrc3 python3 scripts/beta2_rc2_capture.py
      - name: Validate actual screenshots and distinct Co-op/Versus views
        run: |
          python scripts/verify_beta2_v7_screens.py
          python - <<'PY'
          from pathlib import Path
          import struct
          pics=("beta2-rc2-solo-board-android.png","beta2-rc2-basic-gallery-android.png","beta2-rc2-six-insignias-android.png","beta2-rc2-insignia-comparison-android.png")
          blobs=[]
          for name in pics:
              blob=Path(name).read_bytes()
              assert blob[:8]==bytes((137,80,78,71,13,10,26,10)),name
              w,h=struct.unpack(">II",blob[16:24])
              assert w>=320 and h>=500,(name,w,h)
              assert len(blob)>16000,(name,len(blob))
              blobs.append(blob)
          assert len(set(blobs))==len(pics),"screens cannot be duplicates"
          print("PASS: four distinct actual RC2 Android visual evidence screens")
          PY
      - name: Publish complete reviewer APK and Android screenshot evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-Integrated-RC3-OwnerPreview
          path: |
            GridMates-Beta2-Integrated-RC3-OwnerPreview.apk
            GridMates-Beta2-Integrated-RC3-OwnerPreview.apk.sha256
            integrated-badging.txt
            integrated-signer.txt
            beta2-v7-versus-android.png
            beta2-v7-coop-android.png
            beta2-rc2-solo-board-android.png
            beta2-rc2-basic-gallery-android.png
            beta2-rc2-six-insignias-android.png
            beta2-rc2-insignia-comparison-android.png
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics if regression fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-Integrated-RC3-Failure-Diagnostics
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 5
