name: Import GridMates Beta2 five character art pilots

on:
  push:
    branches: [art/beta2-first-five-portrait-pilots]
    paths: ['.github/workflows/gridmates-beta2-pilot-import.yml']

permissions:
  contents: write

jobs:
  import_verified_pilot_art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch originals, verify PNG integrity and exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/beta2-content-pack/pilot-art
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/63102949bf6d46be1899b9fbd4745c38e5c800dcfc73432aab9e37c9763e7870.png" -o "design/beta2-content-pack/pilot-art/farm_cow_pilot.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/03039d4f3ba402d67410790cfcd975f2735f01b08915df30e1064e639abaf7e6.png" -o "design/beta2-content-pack/pilot-art/farm_chicken_pilot.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/c71a38b4f464d801ae6caac962279bffc0b804c4916313f992d920e40fe0e49e.png" -o "design/beta2-content-pack/pilot-art/woodland_raccoon_pilot.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/2214f7b6a8cf4bed950bf80c8e5a1509b955a9959a192d164873d961fd0362b7.png" -o "design/beta2-content-pack/pilot-art/ocean_sea_turtle_pilot.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/4a6b697affea4871b7015389adea24228be0a8bf0a70aa86f3695c32a90f31d8.png" -o "design/beta2-content-pack/pilot-art/garden_firefly_pilot.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/839f962345db4d53ffe125baf774ebdee66edd1a3fcf5723a16edb4e159364eb.png" -o "design/beta2-content-pack/pilot-art/pilot_source_sheet.png"
          python3 - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          manifest=json.loads(Path("design/beta2-content-pack/pilot-art-manifest.json").read_text())
          assert manifest["status"]=="preproduction_pilot_only_NOT_in_game"
          assert len(manifest["files"])==6
          for entry in manifest["files"]:
              p=Path(entry["path"])
              data=p.read_bytes()
              assert hashlib.sha256(data).hexdigest()==entry["sha256"], f"Checksum mismatch: {p}"
              assert len(data)==entry["bytes"], f"Size mismatch: {p}"
              assert data[:8]==bytes((137,80,78,71,13,10,26,10))
              assert data[12:16]==b"IHDR"
              assert struct.unpack(">II",data[16:24])==(entry["width"],entry["height"])
              print("VERIFIED", p)
          PY
      - name: Commit original source sheet and cropped pilot candidates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/beta2-content-pack/pilot-art/*.png
          git diff --cached --quiet && exit 0
          git commit -m "art: preserve five verified Collection portrait pilots outside app resources"
          git push origin HEAD:art/beta2-first-five-portrait-pilots
