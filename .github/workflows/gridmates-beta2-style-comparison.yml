name: GridMates Beta2 visual portrait consistency sheet
on:
  push:
    branches: [art/beta2-first-five-portrait-pilots]
    paths: ['.github/workflows/gridmates-beta2-style-comparison.yml']
permissions:
  contents: write
jobs:
  make-and-preserve-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 -m pip install --user Pillow==11.3.0
      - name: Build canonical vs candidate comparison at equal scale
        run: python3 design/beta2-content-pack/pilot-art/scripts/make_style_comparison.py
      - name: Save source-backed comparison in art-only branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/beta2-content-pack/pilot-art/canonical_style_comparison.png
          git commit -m "qa: compare 5 candidate portraits with 4 existing Collection mascots"
          git push origin HEAD:art/beta2-first-five-portrait-pilots
      - uses: actions/upload-artifact@v4
        with:
          name: GridMates-Beta2-Canonical-Portrait-Comparison
          path: design/beta2-content-pack/pilot-art/canonical_style_comparison.png
          retention-days: 14
