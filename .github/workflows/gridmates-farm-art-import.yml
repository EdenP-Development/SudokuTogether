name: GridMates Farm four-icon verified art import
on:
  push:
    branches: [art/beta2-farm-mixed-icons-pilot]
    paths: ['.github/workflows/gridmates-farm-art-import.yml']
permissions:
  contents: write
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Import original transparent source and exact four RGBA icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/beta2-content-pack/farm-pilot
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/f93edf9f46ac120de862c49b35498cd0ac634587b57201e34bf065af6fd65926.png" -o "design/beta2-content-pack/farm-pilot/farm_mixed_source_sheet.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/d11ee4c00f930aea1f0705470e9e1036de16b8b7f785562b25633a583a618e78.png" -o "design/beta2-content-pack/farm-pilot/farm_sheep.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/fa830dbc2d4a9c4df047d0fe3031202aab57b15615b7ae19c81df39f1f41d2db.png" -o "design/beta2-content-pack/farm-pilot/farm_pig.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/b1c5c1273f380b0ca240cf41619a5706bbba4ea026995d73384aa16489b51f8e.png" -o "design/beta2-content-pack/farm-pilot/farm_pumpkin.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/e20e2a2074e4f3a7bea5a53aa66b0b699a1c173dd14524db6601b8e387c8052c.png" -o "design/beta2-content-pack/farm-pilot/farm_hay_bale.png"
      - name: Verify source/exports and approved fixed metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          m=json.loads(Path("design/beta2-content-pack/farm-pilot/manifest.json").read_text())
          assert m["status"]=="ART_REVIEW_ONLY_NOT_REGISTERED"
          assert m["no_humans"] and m["style"]=="gridmates_chibi_v1"
          assert [x["id"] for x in m["items"]]==[
              "farm_sheep","farm_pig","farm_pumpkin","farm_hay_bale"]
          assert [x["subject_kind"] for x in m["items"]]==[
              "animal","animal","produce","item"]
          for e in [m["source"]]+m["items"]:
              p=Path(e["path"])
              d=p.read_bytes()
              assert len(d)==e["bytes"],f"Wrong size: {p}"
              assert hashlib.sha256(d).hexdigest()==e["sha256"],f"Wrong hash: {p}"
              assert d[:8]==bytes((137,80,78,71,13,10,26,10)) and d[12:16]==b"IHDR",f"Not PNG: {p}"
              assert struct.unpack(">II",d[16:24])==(e["width"],e["height"]),f"Wrong dimensions: {p}"
              assert d[25]==6,f"Expected transparent RGBA PNG: {p}"
              print("PASS exact art",p,e["sha256"])
          PY
      - name: Verify reproducible source crop against imported files
        run: |
          python3 -m pip install --user Pillow==12.3.0
          python3 design/beta2-content-pack/farm-pilot/export_farm_icons.py
      - name: Commit verified assets without touching the Android app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/beta2-content-pack/farm-pilot/*.png
          git diff --cached --quiet && exit 0
          git commit -m "art: import original GridMates Sheep, Pig, Pumpkin and Hay Bale"
          git push origin HEAD:art/beta2-farm-mixed-icons-pilot
