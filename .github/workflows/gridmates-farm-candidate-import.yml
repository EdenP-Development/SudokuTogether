name: Import verified Farm icons into isolated Beta 2 Android review
on:
  push:
    branches: [feat/beta2-farm-mixed-icons-review]
    paths: ['.github/workflows/gridmates-farm-candidate-import.yml']
permissions:
  contents: write
jobs:
  stage-farm-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Fetch exact artwork from source PR and verify SHA-256, RGBA, dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,struct,urllib.request
          from pathlib import Path
          m=json.loads(Path('design/beta2-content-pack/farm-android-review-manifest.json').read_text())
          assert m['status']=='ISOLATED_ANDROID_ART_REVIEW_NOT_RELEASE_APPROVED'
          assert m['no_humans'] and m['source_branch']=='art/beta2-farm-mixed-icons-pilot'
          assert len(m['items'])==4
          assert [x['id'] for x in m['items']] == ['farm_sheep','farm_pig','farm_pumpkin','farm_hay_bale']
          for e in m['items']:
              url='https://raw.githubusercontent.com/PlayerEden/SudokuTogether/'+m['source_branch']+'/'+e['source_path']
              req=urllib.request.Request(url,headers={'User-Agent':'GridMates-Farm-Assets'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  b=response.read()
              assert len(b)==e['bytes'],e['id']
              assert hashlib.sha256(b).hexdigest()==e['sha256'],e['id']
              assert b[:8]==bytes((137,80,78,71,13,10,26,10)) and b[12:16]==b'IHDR'
              assert struct.unpack('>II',b[16:24])==(512,512)
              assert b[25]==6,'Expected transparent RGBA art'
              p=Path(e['android_path'])
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(b)
              print('PASS',e['id'],e['sha256'])
          PY
      - name: Commit verified drawable-only files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/farm_sheep.png app/src/main/res/drawable-nodpi/farm_pig.png app/src/main/res/drawable-nodpi/farm_pumpkin.png app/src/main/res/drawable-nodpi/farm_hay_bale.png
          git diff --cached --quiet && exit 0
          git commit -m 'art: stage verified Farm animals, pumpkin and hay bale in isolated reviewer'
          git push origin HEAD:feat/beta2-farm-mixed-icons-review
