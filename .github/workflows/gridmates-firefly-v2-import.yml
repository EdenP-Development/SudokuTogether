name: GridMates clean Firefly portrait review replacement
on:
  push:
    branches: [feat/beta2-first-five-portraits-review]
    paths: ['.github/workflows/gridmates-firefly-v2-import.yml']
permissions:
  contents: write
jobs:
  verified-firefly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download checked Firefly without glow effects
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180             "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/121274a5e6f5853c57dd51e30e748b16afd72a4e556d3de3c871134369113aff.png"             -o app/src/main/res/drawable-nodpi/garden_firefly.png
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          p=Path("app/src/main/res/drawable-nodpi/garden_firefly.png")
          data=p.read_bytes()
          sha="3831026c7bd7973092775df35ec14f6aa30ef7278b29d1a4998d61eeb1dde4e1"
          assert hashlib.sha256(data).hexdigest()==sha
          assert len(data)==178913
          assert data[:8]==bytes((137,80,78,71,13,10,26,10)) and data[12:16]==b"IHDR"
          assert struct.unpack(">II",data[16:24])==(512,512)
          assert data[25]==6
          m=Path("design/beta2-content-pack/first-five-android-art.json")
          obj=json.loads(m.read_text())
          firefly=next(x for x in obj["images"] if x["id"]=="garden_firefly")
          firefly["sha256"]=sha
          firefly["bytes"]=len(data)
          firefly["review_status"]="v2_clean_no_glow_owner_phone_approval_pending"
          obj["refinement"]="Firefly bottom glow and accent spark marks removed; alpha silhouette kept in flat canonical Collection style"
          m.write_text(json.dumps(obj,indent=2)+"\n")
          print("PASS: clean Firefly alpha PNG and manifest verified")
          PY
      - name: Commit new Firefly image and manifest only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/garden_firefly.png design/beta2-content-pack/first-five-android-art.json
          git commit -m "art: simplify Firefly to match canonical Collection portrait style"
          git push origin HEAD:feat/beta2-first-five-portraits-review
