name: Import four verified mixed Garden icons into isolated Android review
on:
  push:
    branches: [feat/beta2-garden-themed-icons-review]
    paths: ['.github/workflows/gridmates-garden-candidate-import.yml']
permissions:
  contents: write
jobs:
  import-pinned-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and verify original Garden art bytes from art-only PR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,urllib.request,struct
          from pathlib import Path
          p=Path("design/beta2-content-pack/garden-android-review-manifest.json")
          m=json.loads(p.read_text())
          assert m["status"]=="ISOLATED_ANDROID_ART_REVIEW_ONLY_NOT_RELEASE_APPROVED"
          assert m["no_humans"] and len(m["items"])==4
          ids=set()
          for e in m["items"]:
              assert e["id"] not in ids
              ids.add(e["id"])
              assert e["id"].startswith("garden_")
              assert e["subject_kind"] in {"plant","produce","item"}
              url=("https://raw.githubusercontent.com/PlayerEden/SudokuTogether/"
                   + m["source_branch"] + "/" + e["source_path"])
              req=urllib.request.Request(url,headers={"User-Agent":"GridMates-Art-CI"})
              with urllib.request.urlopen(req,timeout=45) as resp:
                  data=resp.read()
              assert hashlib.sha256(data).hexdigest()==e["sha256"],e["id"]
              assert len(data)==e["bytes"],e["id"]
              assert data[:8]==bytes((137,80,78,71,13,10,26,10)) and data[12:16]==b"IHDR",e["id"]
              assert struct.unpack(">II",data[16:24])==(512,512),e["id"]
              assert data[25]==6, "Expected RGBA PNG"
              out=Path(e["android_path"])
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(data)
              print("PASS",e["id"],len(data),e["sha256"])
          PY
      - name: Commit exact verified Garden PNGs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/garden_sunflower.png app/src/main/res/drawable-nodpi/garden_strawberry.png app/src/main/res/drawable-nodpi/garden_watering_can.png app/src/main/res/drawable-nodpi/garden_potted_tulip.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "art: stage four verified Garden sprites on isolated Android branch"
          git push origin HEAD:feat/beta2-garden-themed-icons-review
