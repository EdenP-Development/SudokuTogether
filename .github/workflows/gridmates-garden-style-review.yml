name: GridMates Garden art-style comparison to existing icons
on:
  push:
    branches: [art/beta2-garden-mixed-theme-pilot]
    paths: ['.github/workflows/gridmates-garden-style-review.yml']
permissions:
  contents: write
jobs:
  compare-real-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image inspection tooling
        run: python3 -m pip install --user Pillow==12.3.0
      - name: Compare the four approved and four candidate Garden icons
        run: python3 design/beta2-content-pack/garden-pilot/make_style_comparison.py
      - name: Preserve visual review image in art-only branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/beta2-content-pack/garden-pilot/garden_style_comparison.png
          git commit -m "qa: compare Garden flower and item pilots with current Collection sprites"
          git push origin HEAD:art/beta2-garden-mixed-theme-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: Garden-Mixed-Icon-Style-Review
          path: design/beta2-content-pack/garden-pilot/garden_style_comparison.png
          retention-days: 14
