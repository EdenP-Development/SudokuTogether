name: Import verified Versus V6 canonical woodland race artwork

on:
  push:
    branches: [art/versus-v6-canonical-mascots-review]
    paths: ['.github/workflows/gridmates-versus-v6-art-import.yml']

permissions:
  contents: write

jobs:
  import-verified-v6-rasters:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original animal-free scene and final exact-canonical-character composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/versus-v6/source
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 'https://cdn.openart.ai/openart-uploads/production/attachment-transfers/cdb886aa9110161978102d25651fa39bd364e6083a7eeff68a7b8e5a40523b43.png' -o design/versus-v6/source/forest_race_empty.png
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180 'https://cdn.openart.ai/openart-uploads/production/attachment-transfers/7328809fc605f685c5b0481dfa7ae6c2fb208944bba28765811c096cc9968016.png' -o app/src/main/res/drawable-nodpi/gm_mode_versus_woodland_v6_hd.png
      - name: Verify two original PNGs against source manifest
        run: |
          python3 - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          m=json.loads(Path("design/versus-v6/manifest.json").read_text())
          assert m["status"]=="ISOLATED_ART_REVIEW_NOT_PUBLIC_RELEASE"
          assert m["safe_rollout"]["original_mode_assets_preserved"]
          assert m["composition"]["board_count"]==2
          assert m["composition"]["rows"]==m["composition"]["columns"]==9
          for part in (m["source_scene"],m["output"]):
              p=Path(part["path"]);d=p.read_bytes()
              assert len(d)==part["bytes"],f"Wrong length {p}"
              assert hashlib.sha256(d).hexdigest()==part["sha256"],f"Wrong SHA256 {p}"
              assert d[:8]==bytes((137,80,78,71,13,10,26,10)) and d[12:16]==b"IHDR"
              assert struct.unpack(">II",d[16:24])==(1774,887),f"Wrong dimensions {p}"
              assert d[25]==2,f"Expected opaque RGB raster {p}"
              print("VERIFIED",p,part["sha256"])
          # The approved Co-op and V5 Versus PNGs must remain present.
          for filename in ("gm_mode_coop_woodland_v5_hd.png","gm_mode_versus_woodland_v5_hd.png","woodland_fox.png","woodland_owl.png"):
              assert Path("app/src/main/res/drawable-nodpi",filename).exists(),filename
          PY
      - name: Commit only verified assets to separate artwork review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/versus-v6/source/forest_race_empty.png app/src/main/res/drawable-nodpi/gm_mode_versus_woodland_v6_hd.png
          git diff --cached --quiet && exit 0
          git commit -m 'art: add precise 9x9 Versus V6 scene with canonical Fox/Owl mascots'
          git push origin HEAD:art/versus-v6-canonical-mascots-review
