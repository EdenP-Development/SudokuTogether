name: GridMates veteran progression staging
on:
  push:
    branches: [feat/beta2-veteran-progression-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridmates-veteran-progression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  progression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify core thresholds, save handling and Android compilation
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --max-workers=2 --console=plain
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-veteran-progression-test-reports
          path: |
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7
