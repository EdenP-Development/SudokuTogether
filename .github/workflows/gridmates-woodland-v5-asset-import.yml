name: GridMates Woodland V5 one-time HD asset import

# Import two original PNGs from verified hosted transfers.
# Fail closed against design/ui-art/v5/art_manifest.json checksums.
on:
  push:
    branches: [design/woodland-v5-mode-art-checkpoint]
    paths: ['.github/workflows/gridmates-woodland-v5-asset-import.yml']

permissions:
  contents: write

jobs:
  import-both-pngs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original high-resolution artwork
        shell: bash
        run: |
          set -euo pipefail
          target=app/src/main/res/drawable-nodpi
          mkdir -p "$target"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180             "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/a8381fd35cdc72a8a903e9486b6ce3ed9af70fd938057498936cdb2a5271999b.png"             -o "$target/gm_mode_coop_woodland_v5_hd.png"
          curl -fSL --retry 3 --connect-timeout 15 --max-time 180             "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/cc87b38e97e130ab0665379c73ff4b5f05801a8b315566d7ca98fdb667922b13.png"             -o "$target/gm_mode_versus_woodland_v5_hd.png"

      - name: Require exact manifest SHA-256, byte counts and PNG dimensions
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          m = json.loads(Path("design/ui-art/v5/art_manifest.json").read_text())
          assets = m["new_assets"]
          assert len(assets) == 2
          expected = {"coop", "versus"}
          assert {a["mode"] for a in assets} == expected
          for asset in assets:
              path = Path(asset["resource"])
              data = path.read_bytes()
              h = hashlib.sha256(data).hexdigest()
              assert h == asset["sha256"], f"INVALID HASH: {path}, {h}"
              assert len(data) == asset["bytes"], f"INVALID BYTES: {path}"
              assert data[:8] == bytes((137,80,78,71,13,10,26,10))
              assert data[12:16] == b"IHDR"
              assert struct.unpack(">II",data[16:24]) == (1920,819), f"INVALID DIMENSIONS: {path}"
              print("PASS",path,h)
          PY

      - name: Commit only the two verified PNG resources to the V5 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/gm_mode_coop_woodland_v5_hd.png                   app/src/main/res/drawable-nodpi/gm_mode_versus_woodland_v5_hd.png
          git diff --cached --quiet && { echo "Assets already committed"; exit 0; }
          git diff --cached --name-only
          git commit -m "art: import checksum-verified Woodland V5 Co-op and Versus HD scenes"
          git push origin HEAD:design/woodland-v5-mode-art-checkpoint
