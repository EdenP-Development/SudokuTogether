name: Sudoku board pilots Android verification (temporary)

# One-off validation of PR #53; delete before merging. No APK publishing or signing.
on:
  push:
    branches: [feat/sudoku-beta12-parchment-graphite-boards]
    paths: ['.github/workflows/oneoff-beta12-board-pilots.yml']

permissions:
  contents: read

jobs:
  board-pilot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify core, Android unit and Kotlin compilation
        run: ./gradlew :core:test :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain
      - name: Enable KVM for Android instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Collection card previews, locked state and equip controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.BoardPilotCollectionUiTest
      - name: Upload reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-pilots-android-results-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/reports/tests/**
            core/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 3
