name: GridMates cosmetic ownership migration QA (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/src/main/kotlin/com/playereden/sudokutogether/core/Cosmetics.kt'
      - 'core/src/main/kotlin/com/playereden/sudokutogether/core/PersonalPlay.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/LocalPlayerStore.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/ProgressBackup.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/ProgressBackupStore.kt'
      - 'app/src/androidTest/java/com/playereden/sudokutogether/LocalPlayerStoreTest.kt'
      - 'app/src/androidTest/java/com/playereden/sudokutogether/ProgressBackupTest.kt'
      - '.github/workflows/ownership-migration-qa.yml'

permissions:
  contents: read

concurrency:
  group: gridmates-ownership-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Core tests and Android UI-test compilation
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --no-daemon --max-workers=2 --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify old profile upgrades and backup/restore on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.LocalPlayerStoreTest
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.ProgressBackupTest
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-Ownership-Migration-Failure
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 3
