name: Sudoku Beta 1.2 keypad semantics QA (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/playereden/sudokutogether/PlayScreen.kt'
      - 'app/src/androidTest/java/com/playereden/sudokutogether/SudokuKeypadAccessibilityTest.kt'
      - '.github/workflows/sudoku-beta12-keypad-qa.yml'
permissions:
  contents: read
jobs:
  keypad-regression:
    name: Core, Android units and keypad accessibility emulator
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Core and Android checks
        run: ./gradlew :core:test :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain
      - name: Prepare emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Focused Android API 36 keypad test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.SudokuKeypadAccessibilityTest
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Beta12-Keypad-UI-Failures
          path: |
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 2
