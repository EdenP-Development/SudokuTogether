name: Sudoku Beta 1.2 pencil-contrast QA (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/playereden/sudokutogether/PlayScreen.kt'
      - 'app/src/main/java/com/playereden/sudokutogether/CosmeticPalette.kt'
      - 'app/src/test/java/com/playereden/sudokutogether/BoardPilotPaletteTest.kt'
      - '.github/workflows/sudoku-beta12-note-contrast-ci.yml'

permissions:
  contents: read

jobs:
  pencil-note-contrast:
    name: JVM palette contrast, Android units and Coach emulator
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and run core and Android unit tests
        run: ./gradlew :core:test :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain
      - name: Prepare KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Coach proof rendering on Android API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.CoachProofUiTest
      - name: Upload failed reports briefly
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Beta12-Pencil-Contrast-Failures
          path: |
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 2
