name: Sudoku core JVM regression

# Lightweight, unsigned test gate for Sudoku rules and save/session logic.
# Android UI/emulator and production-signing workflows remain manual.
on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/wrapper/**'
      - '.github/workflows/sudoku-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Replace outdated runs rather than charging minutes for every push.
concurrency:
  group: sudoku-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core JVM tests (no signing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Sudoku core unit tests
        run: ./gradlew :core:test --no-daemon --max-workers=2 --console=plain
