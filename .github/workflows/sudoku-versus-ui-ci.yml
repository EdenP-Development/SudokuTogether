name: Sudoku Versus UI focused regression

# Small, unsigned Android instrumentation gate. Runs only when Versus card UI
# or this focused test workflow changes. The broader screenshot QA stays manual.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/playereden/sudokutogether/VersusPresence.kt'
      - 'app/src/androidTest/java/com/playereden/sudokutogether/VersusPresenceUiTest.kt'
      - '.github/workflows/sudoku-versus-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sudoku-versus-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versus-ui:
    name: Versus UI instrumentation (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout source under test
        uses: actions/checkout@v4
      - name: Set up JDK 17 and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install declared Android build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test active and finished Versus UI only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain \
              -Pandroid.testInstrumentationRunnerArguments.class=com.playereden.sudokutogether.VersusPresenceUiTest
      - name: Upload focused Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Versus-UI-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 3
